    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${x} 0 R >> >> /Contents ${c} 0 R >>`);
    obj(c,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[x]=len;push(`${x} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.b.length} >>\nstream\n`);push(im.b);push("\nendstream\nendobj\n")});

}

<script>/* Local text tools: work offline with no account. Simple statistics-based helpers (not AI). */
const LT_STOP=new Set(("the a an and or but of to in on at for with by is are was were be been it this that these those as from not no can will would should could have has had do does did you he she we they his her their our your my me us في من على إلى عن مع هذا هذه ذلك تلك هو هي هم هن نحن أنا أنت كان كانت يكون تكون ما ماذا لا لم لن قد ثم أو و أن إن إذا كل بعض التي الذي الذين هناك هنا بين حتى عند عندما كما لكن غير بعد قبل أي أيضا فقط").split(" "));
const ltSents=t=>String(t).replace(/[ \t]+/g," ").replace(/([.!?؟])\s+/g,"$1\n").split(/\n+/).map(s=>s.trim()).filter(s=>s.length>8);
const ltWords=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(w=>w.length>2&&!LT_STOP.has(w));
function ltRank(ss){const f={};ss.forEach(s=>ltWords(s).forEach(w=>f[w]=(f[w]||0)+1));return ss.map((s,i)=>{const w=ltWords(s);return{s,i,w,f,sc:w.reduce((a,x)=>a+f[x],0)/Math.max(6,w.length)}})}
const ltHead=l=>l.length<=50&&!/[.!?؟،,;]$/.test(l)&&l.split(/\s+/).length<=7;
const ltFormat=t=>{const ls=String(t).split("\n").map(l=>l.trim()).filter(Boolean);return ls.map((l,i)=>{if(i==0&&ltHead(l)&&ls.length>1)return "# "+l;if(/:$/.test(l)&&l.length<60)return "## "+l.replace(/:$/,"");if(/^([-*•]|\d+[.)]|[٠-٩]+[.)])\s*/.test(l))return "- "+l.replace(/^([-*•]|\d+[.)]|[٠-٩]+[.)])\s*/,"");return l}).join("\n")};
const LT={
  sum:t=>{const R=ltRank(ltSents(t));if(!R.length)return"";const n=Math.max(1,Math.min(5,Math.round(R.length/3))),top=[...R].sort((a,b)=>b.sc-a.sc).slice(0,n).sort((a,b)=>a.i-b.i);return "# "+tx(["ملخص","Summary"])+"\n"+top.map(x=>"- "+x.s).join("\n")},
  pts:t=>{const heads=String(t).split("\n").map(l=>l.trim()).filter(l=>l&&ltHead(l)),R=ltRank(ltSents(t)).sort((a,b)=>b.sc-a.sc).slice(0,6).sort((a,b)=>a.i-b.i);return heads.map(h=>"# "+h).join("\n")+(heads.length?"\n":"")+R.map(x=>"- "+x.s).join("\n")},
  qa:t=>{const R=ltRank(ltSents(t)),out=[],dEn=/^(.{3,40}?)\s+(is|are|means|refers to)\s+(.{6,})$/i,dAr=/^(.{2,30}?)\s+(هو|هي|هم|يعني|تعني)\s+(.{4,})$/;
    R.forEach(x=>{if(out.length>=20)return;let m=x.s.match(dAr);if(m){out.push("Q: ما "+(m[2]=="هي"||m[2]=="تعني"?"هي":"هو")+" "+m[1]+"؟");out.push("A: "+x.s);return}
      m=x.s.match(dEn);if(m){out.push("Q: What is "+m[1]+"?");out.push("A: "+x.s);return}
      const w=x.w.filter(k=>k.length>3).sort((a,b)=>(x.f[b]||0)-(x.f[a]||0)||b.length-a.length)[0];
      if(w){out.push("Q: "+tx(["أكمل: ","Fill in: "])+x.s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),"_____"));out.push("A: "+w)}});
    return out.join("\n")},
  fix:t=>String(t).split("\n").map(l=>l.replace(/[ \t]+/g," ").replace(/\s+([,;:!?؟،])/g,"$1").replace(/([,;:!?؟،])(?=[^\s\d,;:!?؟،)\]"'])/g,"$1 ").trim().replace(/^([a-z])/,c=>c.toUpperCase())).join("\n").replace(/\n{3,}/g,"\n\n"),
  rew:ltFormat,page:ltFormat
};

  guide:()=>{const g=[[S.tasks.length>0,["أنشئ أول مهمة","Create your first task"],"tasks"],[S.tasks.some(k=>k.subs.length),["أضف مهام فرعية بنقاط","Add subtasks with points"],"tasks"],[S.sessions.length>0,["ابدأ جلسة بومودورو","Run a Pomodoro session"],"pomo"],[S.subj.length>0,["أضف مادة دراسية","Add a subject"],"sjs"],[(S.nbs||[]).length>0,["أنشئ دفتراً","Create a notebook"],"notes"]],d=g.filter(x=>x[0]).length;

  stats:()=>{const A=S.tasks.filter(k=>!k.arch),dn=A.filter(k=>k.done).length,td=dk(Date.now()),st=(l,v)=>`<div class="stat2"><small>${l}</small><b>${v}</b></div>`;

  actions:()=>`<div class="row"><button class="b" data-a="go" data-v="tasks">+ ${t("add")}</button><button class="g" data-a="go" data-v="pomo">⏱ ${t("focus")}</button><button class="g" data-a="go" data-v="notes">📝 ${t("notes")}</button><button class="g" data-a="qr">▦ ${t("share")}</button></div>`,
  today:()=>{const td=dk(Date.now()),L=S.tasks.filter(k=>!k.done&&!k.arch&&k.due&&k.due<=td).slice(0,6);
    return L.map(k=>`<div class="sub"><button class="g" data-a="done" data-i="${k.id}" aria-label="done">✓</button><span style="flex:1">${esc(k.title)}</span>${k.due<td?`<small style="color:var(--hi)">${tx(["متأخرة","Overdue"])}</small>`:""}</div>`).join("")||dEmpty(tx(["لا مهام مستحقة اليوم 🎉","Nothing due today 🎉"]))},
  deadlines:()=>{const td=dk(Date.now()),L=S.tasks.filter(k=>!k.done&&!k.arch&&k.due&&k.due>td).sort((a,b)=>a.due>b.due?1:-1).slice(0,5);
    return L.map(k=>`<div class="sub"><span style="flex:1">${esc(k.title)}</span><small style="color:var(--tx2)">${esc(k.due)}</small></div>`).join("")||dEmpty("—")},
  week:()=>chart(),
  goal:()=>{const m=dayMin(dk(Date.now()));return `<b style="font-size:20px">${fm(m)}</b> <small style="color:var(--tx2)">/ ${fm(S.set.goal)}</small><div class="bar"><i style="width:${Math.min(100,m/S.set.goal*100)}%"></i></div>`},
  streak:()=>`<div class="stg"><div class="stat2"><small>${t("streak")}</small><b>🔥 ${nf(streak())}</b></div><div class="stat2"><small>${t("pts")}</small><b>${nf(dayPts(dk(Date.now())))}</b></div><div class="stat2"><small>${t("lt")}</small><b>${nf(allPts())}</b></div></div>`,
  exams:()=>{const td=dk(Date.now()),x=[...S.exams].filter(e=>e.d>=td).sort((a,b)=>a.d>b.d?1:-1)[0];return x?`<b>${esc(x.t)}</b><br><small style="color:var(--tx2)">${esc(x.s)} · ${esc(x.d)}</small>`:dEmpty("—")},
  habits:()=>{const td=dk(Date.now());return S.habits.slice(0,5).map(h=>`<div class="sub"><span style="flex:1">${esc(h.n)}</span><button class="${h.log.includes(td)?"b":"g"}" data-a="ht" data-i="${h.id}">✓</button></div>`).join("")||dEmpty("—")},
  notebooks:()=>{const L=(S.nbs||[]).slice(0,3);return L.map(n=>`<div class="sub" data-n="open" data-v="${esc(n.id)}" style="cursor:pointer"><span style="flex:1">${n.pdf?"📄":"📓"} ${esc(n.title)}</span><small style="color:var(--tx2)">${nf(n.pages||1)}</small></div>`).join("")+`<button class="g" data-a="go" data-v="notes" style="margin-top:8px">${tx(["كل الدفاتر","All notebooks"])}</button>`},
  prayer:()=>{if(!pbarFaith())return dEmpty("—");const T=ptimes(new Date()),now=Date.now(),nn=T.findIndex((x,i)=>i!=1&&x>now);return nn<0?dEmpty("—"):`<b style="font-size:20px">${PN[S.set.lang][nn]} · ${fh(T[nn])}</b><br><small style="color:var(--tx2)">${tx(["بعد","in"])} ${fm(Math.round((T[nn]-now)/6e4))}</small>`},
  timer:()=>`<div class="big tmt" style="text-align:start">${mm(rem())}</div><div class="row"><button class="b" data-a="ts">${S.tm.running?t("pause"):t("start")}</button><button class="g" data-a="go" data-v="pomo">⏱</button></div>`
};
function dashView(){
  const L=dLayout(),avail=Object.keys(DW_LABEL).filter(w=>!L.some(x=>x.w==w)&&(w!="prayer"||pbarFaith()));
  const bar=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-size:20px">${t("dash")}</b><button class="${dEdit?"b":"g"}" data-d="edit">${dEdit?"✓ "+tx(["تم","Done"]):"✎ "+tx(["تعديل","Customize"])}</button></div>`;
  const tools=dEdit?`<div class="card"><div class="row"><label>${tx(["قالب جاهز","Template"])}</label>${Object.keys(DT).map(k=>`<button class="g" data-d="tpl" data-v="${k}">${tx(DT_LABEL[k])}</button>`).join("")}</div>${avail.length?`<div class="row" style="margin-top:10px"><label>${tx(["إضافة ودجت","Add widget"])}</label>${avail.map(w=>`<button class="g" data-d="add" data-v="${w}">＋ ${tx(DW_LABEL[w])}</button>`).join("")}</div>`:""}</div>`:"";
  return bar+tools+`<div class="dw">${L.map((x,i)=>x.w=="prayer"&&!pbarFaith()?"":`<div class="card w ${x.f?"f":""} ${dEdit?"ed":""}">${dEdit?`<div class="dctl"><b>${tx(DW_LABEL[x.w]||["",""])}</b><span><button class="g" data-d="up" data-v="${i}">↑</button><button class="g" data-d="dn" data-v="${i}">↓</button><button class="g" data-d="sz" data-v="${i}">${x.f?"▭":"▬"}</button><button class="g" data-d="rm" data-v="${i}">✕</button></span></div>`:x.w=="greet"?"":`<b style="display:block;margin-bottom:8px">${tx(DW_LABEL[x.w]||["",""])}</b>`}${(DWR[x.w]||(()=>""))()}</div>`).join("")}</div>${verCard()}`;
}
const __vDash=views;views=function(){return pg=="dash"?dashView():__vDash()};
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-d]");if(!b)return;const a=b.dataset.d,v=b.dataset.v,i=+v,L=dLayout().map(x=>({...x}));
  if(a=="edit")dEdit=!dEdit;else if(a=="open"){pg="dash";dEdit=true}
  else if(a=="tpl"&&DT[v])S.dash=DT[v].map(w=>({w,f:DW_FULL.includes(w)?1:0}));
  else if(a=="add"&&DW_LABEL[v]){L.push({w:v,f:DW_FULL.includes(v)?1:0});S.dash=L}
  else if(a=="rm"){L.splice(i,1);S.dash=L}
  else if(a=="up"&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]];S.dash=L}
  else if(a=="dn"&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];S.dash=L}
  else if(a=="sz"){L[i].f=L[i].f?0:1;S.dash=L}
  sv();render();
});
const dashEditCard=()=>`<div class="card"><b>🧩 ${tx(["الصفحة الرئيسية","Home page"])}</b><p style="color:var(--tx2);font-size:13px;line-height:1.7">${tx(["أضف ودجت أو احذفها ورتّبها، أو اختر قالباً جاهزاً.","Add, remove and reorder widgets, or pick a ready-made template."])}</p><button class="b" data-d="open">${tx(["تخصيص الرئيسية","Customize home"])}</button></div>`;
const profCard=()=>{const s=S.set,O=(k,L)=>`<select data-a="ap" data-v="${k}"><option value="">${tx(["—","—"])}</option>${L.map(x=>`<option value="${x[0]}" ${s[k]==x[0]?"selected":""}>${tx(x[1])}</option>`).join("")}</select>`;
  return `<div class="card"><b>👤 ${tx(["بياناتي","My profile"])}</b><div class="row" style="margin-top:10px"><label>${tx(["الجنس","Gender"])}</label>${O("gender",[["m",["ذكر","Male"]],["f",["أنثى","Female"]]])}<label>${tx(["العمر","Age"])}</label><input type="number" min="5" max="99" style="max-width:80px;flex:none" value="${s.age||""}" data-a="ap" data-v="age"></div><div class="row" style="margin-top:10px"><label>${tx(["الديانة","Faith"])}</label>${O("faith",[["m",["مسلم","Muslim"]],["c",["مسيحي","Christian"]],["o",["أخرى","Other"]]])}</div><small style="color:var(--tx2);display:block;margin-top:8px;line-height:1.6">${tx(["اختيارية وتُحفظ على جهازك فقط. تُستخدم لتخصيص التحية وإظهار ميزة الصلاة.","Optional, stored on this device only. Used for the greeting and the prayer feature."])}</small></div>`};

<script>/* Version number, "What's new", NEW badges, and automatic updates (no button: the app checks quietly and refreshes itself when it is safe). */
const APP_VERSION="2.4.0";
const RELEASES=[
 {v:"2.4.0",d:"2026-11-08",n:[["تحديث تلقائي بدون أزرار","Automatic updates, no buttons"],["دفاتر بشكل جديد: أيقونات واضحة وقائمة «المزيد» وشرح أول مرة","Notebooks redesigned: clear icons, a More menu and a first-run guide"],["تحويل الخط إلى نص بدون حساب (مدمج أو عبر الإنترنت باختيارك)","Handwriting → text with no account (built-in or online, your choice)"],["إزالة المكتبة العامة والاعتماد على Claude","Removed the public library and the Claude dependency"]]},
 {v:"2.3.0",d:"2026-11-07",n:[["كل ميزات الدفاتر تعمل بدون أي حساب","Every notebook feature works with no account"],["تلخيص ونقاط وأسئلة وتنسيق محلياً بدون إنترنت","Local summary, key points, quiz and formatting, offline"],["نسخة احتياطية واستعادة للدفاتر وفحص الجهاز","Notebook backup/restore and Device check"]]},
 {v:"2.2.0",d:"2026-11-06",n:[["تكبير وتنقل أفضل وشبكة صفحات","Better zoom, panning and a page grid"],["نص متعدد الأسطر وتصدير صفحة أو دفتر","Multi-line text, export a page or a notebook"],["شريط جديد للهاتف واللوحي","New phone and tablet navigation"]]}
];
const NEW_IN={notes:"2.4.0"};
const isNew=k=>!!NEW_IN[k]&&NEW_IN[k]==APP_VERSION&&!(S.seenNew||[]).includes(k+NEW_IN[k]);
const cmpVer=(a,b)=>{const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0};
let updLog=false;
const __vNew=views;views=function(){const k=pg;if(isNew(k))setTimeout(()=>{S.seenNew=[...(S.seenNew||[]),k+NEW_IN[k]];sv()},4000);return __vNew()};
const verCard=()=>`<div class="row" style="justify-content:space-between;margin-top:14px;color:var(--tx2);font-size:12px"><span>ELITE STUDY v${APP_VERSION}</span><button class="g" data-u="log" style="padding:4px 10px;min-height:0">🆕 ${tx(["ما الجديد","What’s new"])}</button></div>${updLog?`<div class="card">${RELEASES.map((r,i)=>`<div style="margin-bottom:10px"><b>v${r.v}</b> <small style="color:var(--tx2)">${r.d}</small>${i==0?' <span class="tag nw">NEW</span>':""}${r.n.map(x=>`<div class="sub"><span>• ${tx(x)}</span></div>`).join("")}</div>`).join("")}</div>`:""}`;
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("[data-u=log]")){updLog=!updLog;render()}});
/* automatic update: runs only on a real website; never interrupts writing, a running timer or an open dialog */
async function remoteVersion(){
  try{const r=await fetch("version.json?"+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.version)return String(j.version)}}catch(e){}
  try{const r=await fetch(location.href.split("#")[0],{cache:"no-store"});if(r.ok){const m=(await r.text()).match(/const APP_VERSION="([\d.]+)"/);if(m)return m[1]}}catch(e){}
  return null;
}
const safeNow=()=>!nbState&&!S.tm.running&&!document.hidden&&!document.querySelector(".modal,.nbo,.pv,.nbcoach");
let updBusy=false;
async function autoUpdate(){
  if(updBusy||!location.protocol.startsWith("http")||/claude|usercontent/.test(location.hostname))return;
  updBusy=true;
  try{
    const v=await remoteVersion();if(!v||cmpVer(v,APP_VERSION)<=0){updBusy=false;return}
    const urls=[...document.querySelectorAll("script[src],link[rel=stylesheet]")].map(x=>x.src||x.href).filter(u=>u.startsWith(location.origin));
    await Promise.all([location.href.split("#")[0],...urls].map(u=>fetch(u,{cache:"reload"}).catch(()=>0)));
    toast(tx(["تم تنزيل تحديث جديد وسيُطبَّق تلقائياً","A new update was downloaded and will apply automatically"]));
    const go=()=>{if(safeNow())location.reload();else setTimeout(go,30000)};go();
  }catch(e){updBusy=false}
}
if(S.set.lastVer&&S.set.lastVer!=APP_VERSION)setTimeout(()=>toast(tx(["تم تحديث التطبيق إلى v","App updated to v"])+APP_VERSION+" 🆕"),2500);
S.set.lastVer=APP_VERSION;setTimeout(sv,3000);
setTimeout(autoUpdate,5000);setInterval(autoUpdate,30*60*1000);
</script>
<script>/* Device check: tells each user what works on their device (useful on managed school devices). */
let diagRes=null;
const diagLine=(ok,l,hint)=>`<div class="sub"><span style="flex:1">${ok===true?"✅":ok===false?"❌":"⚠️"} ${l}</span></div>${ok!==true&&hint?`<small style="color:var(--tx2);display:block;margin:-2px 0 8px;line-height:1.6">${hint}</small>`:""}`;
async function diagRun(){
  const r={};r.touch=matchMedia("(pointer:coarse)").matches;
  try{await nbTx("readwrite",s=>s.put({id:"__d",pages:[]}));await nbTx("readwrite",s=>s.delete("__d"));r.store=!NB_MEM}catch(e){r.store=false}
  try{r.persist=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null}catch(e){r.persist=null}
  r.hw={};for(const l of["ar","en"]){try{r.hw[l]=navigator.queryHandwritingRecognizerSupport?!!(await navigator.queryHandwritingRecognizerSupport({languages:[l]})).languages:false}catch(e){r.hw[l]=false}}
  r.online=navigator.onLine;r.pdf=typeof pdfjsLib!="undefined";r.qr=!!window.QRCode;diagRes=r;render();
}
const diagCard=()=>{const r=diagRes;return `<div class="card"><b>🩺 ${tx(["فحص الجهاز","Device check"])}</b><p style="color:var(--tx2);font-size:13px;line-height:1.7">${tx(["يوضح ما الذي يعمل على جهازك وما الذي تمنعه سياسة المدرسة أو المتصفح، بدون حساب.","Shows what works on your device and what school or browser policy blocks. No account needed."])}</p><button class="b" data-g="diag">${tx(["ابدأ الفحص","Run check"])}</button>${r?`<div style="margin-top:10px">${diagLine(r.store,tx(["حفظ الدفاتر على الجهاز","Saving notebooks on this device"]),tx(["التخزين ممنوع أو مؤقت (وضع خاص أو سياسة المدرسة). ستضيع الدفاتر عند الإغلاق، فاستخدم «نسخة احتياطية» في الملاحظات.","Storage is blocked or temporary (private mode or school policy). Notebooks are lost on close, so use Backup in Notes."]))}${diagLine(r.persist,tx(["تخزين دائم","Persistent storage"]),tx(["قد يمسح المتصفح البيانات عند امتلاء المساحة. خذ نسخة احتياطية دورياً.","The browser may clear data when space runs low. Back up regularly."]))}${diagLine(r.hw.ar,tx(["تحويل الخط العربي إلى نص","Arabic handwriting → text"]),tx(["غير مدمج في جهازك. فعّل «التعرّف عبر الإنترنت» من الإعدادات ← الأداء والرسائل، أو استخدم أداة النص (T).","Not built into your device. Turn on online recognition in Settings → Performance & messages, or use the Text tool (T)."]))}${diagLine(r.hw.en,tx(["تحويل الخط الإنجليزي إلى نص","English handwriting → text"]),"")}${diagLine(r.pdf,tx(["مكتبة PDF","PDF library"]),tx(["لم تُحمّل (إنترنت ضعيف أو حظر cdnjs). استيراد PDF لن يعمل.","Not loaded (weak internet or cdnjs blocked). PDF import won’t work."]))}${diagLine(r.online,tx(["الاتصال بالإنترنت","Internet connection"]),"")}</div>`:""}</div>`};
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("[data-g=diag]"))diagRun()});
</script>
<script>/* Entry point: runs after every other script has loaded. */
function sanitize(o){
  const A=k=>Array.isArray(o[k])?o[k].filter(x=>x&&typeof x=="object"):[];
  return {...S,tasks:A("tasks"),sessions:A("sessions"),notes:A("notes"),subj:A("subj"),exams:A("exams"),habits:A("habits"),cards:A("cards"),tpls:A("tpls"),nbs:A("nbs"),rt:A("rt"),
    set:{...S.set,...(o.set&&typeof o.set=="object"&&!Array.isArray(o.set)?o.set:{})},lic:S.lic};
}
(async function(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(S.tm.running&&S.tm.endAt<=Date.now())finish();
  render();
  try{await nbTx('readwrite',s=>s.put({id:'__t',pages:[]}));await nbTx('readwrite',s=>s.delete('__t'))}catch(e){}
  try{await nbMigrate();render()}catch(e){}
})();
</script>
