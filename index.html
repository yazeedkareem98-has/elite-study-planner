<script>/* Local text tools: work offline with no account. Simple statistics-based helpers (not AI). */
const LT_STOP=new Set(("the a an and or but of to in on at for with by is are was were be been it this that these those as from not no can will would should could have has had do does did you he she we they his her their our your my me us في من على إلى عن مع هذا هذه ذلك تلك هو هي هم هن نحن أنا أنت كان كانت يكون تكون ما ماذا لا لم لن قد ثم أو و أن إن إذا كل بعض التي الذي الذين هناك هنا بين حتى عند عندما كما لكن غير بعد قبل أي أيضا فقط").split(" "));
const ltSents=t=>String(t).replace(/[ \t]+/g," ").replace(/([.!?؟])\s+/g,"$1\n").split(/\n+/).map(s=>s.trim()).filter(s=>s.length>8);
const ltWords=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(w=>w.length>2&&!LT_STOP.has(w));
function ltRank(ss){const f={};ss.forEach(s=>ltWords(s).forEach(w=>f[w]=(f[w]||0)+1));return ss.map((s,i)=>{const w=ltWords(s);return{s,i,w,f,sc:w.reduce((a,x)=>a+f[x],0)/Math.max(6,w.length)}})}
const ltHead=l=>l.length<=50&&!/[.!?؟،,;]$/.test(l)&&l.split(/\s+/).length<=7;
const ltFormat=t=>{const ls=String(t).split("\n").map(l=>l.trim()).filter(Boolean);return ls.map((l,i)=>{if(i==0&&ltHead(l)&&ls.length>1)return "# "+l;if(/:$/.test(l)&&l.length<60)return "## "+l.replace(/:$/,"");if(/^([-*•]|\d+[.)]|[٠-٩]+[.)])\s*/.test(l))return "- "+l.replace(/^([-*•]|\d+[.)]|[٠-٩]+[.)])\s*/,"");return l}).join("\n")};
const LT={
  sum:t=>{const R=ltRank(ltSents(t));if(!R.length)return"";const n=Math.max(1,Math.min(5,Math.round(R.length/3))),top=[...R].sort((a,b)=>b.sc-a.sc).slice(0,n).sort((a,b)=>a.i-b.i);return "# "+tx(["ملخص","Summary"])+"\n"+top.map(x=>"- "+x.s).join("\n")},
  pts:t=>{const heads=String(t).split("\n").map(l=>l.trim()).filter(l=>l&&ltHead(l)),R=ltRank(ltSents(t)).sort((a,b)=>b.sc-a.sc).slice(0,6).sort((a,b)=>a.i-b.i);return heads.map(h=>"# "+h).join("\n")+(heads.length?"\n":"")+R.map(x=>"- "+x.s).join("\n")},
  qa:t=>{const R=ltRank(ltSents(t)),out=[],dEn=/^(.{3,40}?)\s+(is|are|means|refers to)\s+(.{6,})$/i,dAr=/^(.{2,30}?)\s+(هو|هي|هم|يعني|تعني)\s+(.{4,})$/;
    R.forEach(x=>{if(out.length>=20)return;let m=x.s.match(dAr);if(m){out.push("Q: ما "+(m[2]=="هي"||m[2]=="تعني"?"هي":"هو")+" "+m[1]+"؟");out.push("A: "+x.s);return}
      m=x.s.match(dEn);if(m){out.push("Q: What is "+m[1]+"?");out.push("A: "+x.s);return}
      const w=x.w.filter(k=>k.length>3).sort((a,b)=>(x.f[b]||0)-(x.f[a]||0)||b.length-a.length)[0];
      if(w){out.push("Q: "+tx(["أكمل: ","Fill in: "])+x.s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),"_____"));out.push("A: "+w)}});
    return out.join("\n")},
  fix:t=>String(t).split("\n").map(l=>l.replace(/[ \t]+/g," ").replace(/\s+([,;:!?؟،])/g,"$1").replace(/([,;:!?؟،])(?=[^\s\d,;:!?؟،)\]"'])/g,"$1 ").trim().replace(/^([a-z])/,c=>c.toUpperCase())).join("\n").replace(/\n{3,}/g,"\n\n"),
  rew:ltFormat,page:ltFormat
};
</script>

  async function importPdf(file){if(!window.pdfjsLib){toast(t4('مكتبة PDF لم تُحمّل بعد','PDF library is not ready'));return}if(file.size>100*1024*1024){toast(t4('الملف أكبر من 100 ميجابايت','File exceeds 100 MB'));return}try{toast(t4('جارٍ استيراد PDF…','Importing PDF…'));pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise,pages=[];for(let i=1;i<=Math.min(doc.numPages,100);i++){const pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),scale=Math.min(3,2800/v0.width,4200/v0.height),v=pg.getViewport({scale}),c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;pages.push({i:[],h:Math.round(W*v0.height/v0.width),bg:c.toDataURL('image/png')});c.width=0;c.height=0}const id=uid4(),book={id,title:file.name.replace(/\.pdf$/i,''),paper:'blank',pcol:'#fff',pages:pages.length,pdf:1,upd:Date.now()};await writeBook(id,pages);S.nbs=[book,...(S.nbs||[])];sv();render();open(id);if(doc.numPages>100)toast(t4('تم استيراد أول 100 صفحة','First 100 pages imported'))}catch(e){toast(t4('تعذّر استيراد الملف','Could not import PDF'))}}
  async function backup(){try{const out=[];for(const b of S.nbs||[]){const r=await readBook(b.id);out.push({meta:b,pages:r?.pages||[]})}download(new Blob([JSON.stringify({app:'ELITE STUDY Notes 4',version:4,books:out})],{type:'application/json'}),'elite-notes-backup.json')}catch(e){toast(t4('تعذّر إنشاء النسخة الاحتياطية','Backup failed'))}}
  async function restore(file){try{const j=JSON.parse(await file.text());if(!Array.isArray(j.books))throw 0;for(const x of j.books){if(!x.meta?.id||!Array.isArray(x.pages))continue;await writeBook(x.meta.id,norm(x.pages));S.nbs=[x.meta,...(S.nbs||[]).filter(b=>b.id!==x.meta.id)]}sv();render();toast(t4('تمت استعادة الدفاتر','Notebooks restored'))}catch(e){toast(t4('ملف النسخة الاحتياطية غير صالح','Invalid backup file'))}}
  async function deleteNotebook(id){const b=(S.nbs||[]).find(x=>x.id===id);if(!b)return;if(!confirm(t4('هل تريد حذف هذا الدفتر؟','Delete this notebook?')))return;S.nbs=S.nbs.filter(x=>x.id!==id);try{await deleteBook(id)}catch(e){}sv();render()}
  function view(){addStyles();return home()}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-n4]');if(!b)return;const a=b.dataset.n4,id=b.dataset.id;if(a==='new')newDialog();if(a==='open')open(id);if(a==='delete')deleteNotebook(id);if(a==='backup')backup()});
  document.addEventListener('input',e=>{if(e.target.id==='n4-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('.n4-card').forEach(c=>c.hidden=!c.textContent.toLowerCase().includes(q))}});
  document.addEventListener('change',e=>{if(e.target.id==='n4-pdf'&&e.target.files[0])importPdf(e.target.files[0]);if(e.target.id==='n4-restore'&&e.target.files[0])restore(e.target.files[0])});
  addStyles();window.addEventListener('pagehide',()=>{if(state.book)flush()});nbView=view;nbNew=newDialog;nbOpen=open;nbClose=close;nbSave=queueSave;nbFlush=flush;
})();
