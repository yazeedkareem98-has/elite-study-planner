:root{--bg:#1c1e22;--bar:#2a2d32;--b2:#363a41;--ink:#eef1f3;--mut:#9aa4ac;--line:#41464d;--acc:#4cc2ff;--af:#03202d;--bad:#ff8a80;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#e4e8eb;--bar:#fbfcfd;--b2:#eceff2;--ink:#1b2126;--mut:#5c6770;--line:#d2d8dd;--bad:#b3261e;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:8px;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--b2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ib{width:34px;height:34px;display:grid;place-items:center;flex:none}
.ib svg,.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib:hover,.mi:hover,.chip:hover{background:var(--b2)}
.ib[aria-pressed=true],.chip[aria-pressed=true]{background:var(--acc);color:var(--af)}
.chip{padding:5px 11px;border:1px solid var(--line);min-height:32px}
#lib,#app{display:flex;flex-direction:column;height:100%}#app{display:none}
body.ed #app{display:flex}body.ed #lib{display:none}
#lib>header{display:flex;align-items:center;gap:10px;padding:14px 22px;flex-wrap:wrap}
#lib b{font-size:24px;margin-inline-end:8px}#qs{flex:1;max-width:380px;min-width:150px}
#tabs{display:flex;gap:8px;padding:0 22px 8px}
#grid{flex:1;overflow:auto;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 22px;align-content:start}
.nb{display:flex;flex-direction:column;align-items:center}
.cvr{width:100%;max-width:180px;height:122px;border-radius:5px 14px 14px 5px;color:#fff;font-weight:600;padding:12px;display:flex;align-items:flex-end;cursor:pointer;overflow-wrap:anywhere;box-shadow:inset 8px 0 0 #0003,0 3px 8px #0004}
.meta{color:var(--mut);font-size:12px;padding:8px 0 2px}.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.acts button{padding:4px 8px;font-size:12px;background:var(--b2)}
#top{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--bar);border-bottom:1px solid var(--line);direction:ltr}
#nt{font-weight:600;max-width:24vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl}
#st{color:var(--mut);font-size:12px;flex:1;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}#st.err{color:var(--bad);font-weight:600}
#pn{min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
#rb{display:flex;overflow-x:auto;background:var(--bar);border-bottom:1px solid var(--line);padding:4px 6px;scrollbar-width:none;direction:ltr}#rb::-webkit-scrollbar{display:none}
.g{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 9px;border-inline-end:1px solid var(--line);flex:none}
.r{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,34px);gap:2px}
